<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'Outfit';
    src: local('Outfit');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  body {
    font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #090d16 0%, #111827 60%, #1e1b4b 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .avatar {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    object-fit: cover;
    box-shadow: 0 20px 60px -10px rgba(99,102,241,0.6);
    margin-bottom: 2rem;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 0 80px;
  }
  h1 {
    font-size: 3.4rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #f8fafc;
    margin-bottom: 0.8rem;
  }
  p {
    font-size: 1.4rem;
    color: #94a3b8;
    font-weight: 400;
    max-width: 900px;
  }
  .badge {
    margin-top: 2rem;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: rgba(255,255,255,0.06);
    border: 1px solid #1f2937;
    padding: 0.7rem 1.4rem;
    border-radius: 9999px;
    color: #6366f1;
    font-weight: 500;
    font-size: 1.1rem;
  }
</style>
</head>
<body>
  <div class="wrap">
    <img class="avatar" src="avatar.png" alt="">
    <h1>Prof. João Miguel</h1>
    <p>Faculdade de Tecnologia SENAI Porto Alegre &mdash; Internet das Coisas, Sistemas Embarcados e Programação</p>
    <div class="badge">professorjoaomiguel.github.io</div>
  </div>
</body>
</html>
